# flake8 has no pyproject.toml support, so its settings live here.
# Keep max-line-length in step with pylint's (pyproject.toml, [tool.pylint]).
[flake8]
max-line-length = 300
per-file-ignores =
    # xp.pyi is generated by generate_xp_pyi.py, which emits each signature on
    # one line; a few run past 300 characters.
    xp.pyi: E501
    # xp.py re-exports each C module's names right after importing it, so its
    # 23 imports are interleaved with the alias blocks they feed.  Hoisting
    # them to the top would separate every import from its own exports.
    xp.py: E402
